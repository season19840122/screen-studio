name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Read and validate version
        id: meta
        run: |
          set -euo pipefail
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "v${short}" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::tag $GITHUB_REF_NAME 与 Resources/Info.plist 的版本 $short 不一致"
              exit 1
            fi
          fi
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Import signing identity
        id: sign
        env:
          CERT_P12: ${{ secrets.DOGSC_SIGNING_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.DOGSC_SIGNING_CERTIFICATE_PASSWORD }}
          CERT_IDENTITY: ${{ secrets.DOGSC_SIGNING_IDENTITY_SHA1 }}
        run: |
          set -euo pipefail
          # 未配置证书时退回 ad-hoc 签名：能构建能运行，但 cdhash 每次不同，
          # 装上之后屏幕录制授权会被重置。
          if [[ -z "${CERT_P12:-}" || -z "${CERT_PASSWORD:-}" || -z "${CERT_IDENTITY:-}" ]]; then
            echo "未配置签名证书，使用 ad-hoc 签名"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keychain="$RUNNER_TEMP/dogsc-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"
          certificate="$RUNNER_TEMP/dogsc-signing.p12"

          printf '%s' "$CERT_P12" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" -P "$CERT_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$CERT_IDENTITY"

          echo "identity=$CERT_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build app
        env:
          SIGNING_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          set -euo pipefail

          swift build -c release --product DogSC
          binary_dir="$(swift build -c release --show-bin-path)"

          app="$RUNNER_TEMP/DogSC.app"
          mkdir -p \
            "$app/Contents/MacOS" \
            "$app/Contents/Frameworks" \
            "$app/Contents/Resources"
          cp "$binary_dir/DogSC" "$app/Contents/MacOS/DogSC"
          cp Resources/Info.plist "$app/Contents/Info.plist"
          cp Resources/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          for resource in en.lproj zh-Hans.lproj Fonts Onboarding Support; do
            ditto "Resources/$resource" "$app/Contents/Resources/$resource"
          done
          (cd "$app/Contents/Resources/Fonts" && shasum -a 256 -c SHA256SUMS)

          sparkle_framework="$(
            find .build/artifacts -type d -name Sparkle.framework \
              -path '*macos-arm64_x86_64*' -print -quit
          )"
          [[ -n "$sparkle_framework" ]]
          ditto "$sparkle_framework" "$app/Contents/Frameworks/Sparkle.framework"

          framework_b="$app/Contents/Frameworks/Sparkle.framework/Versions/B"
          sign=(--force --options runtime --sign "$SIGNING_IDENTITY")

          codesign "${sign[@]}" "$framework_b/XPCServices/Installer.xpc"
          codesign "${sign[@]}" --preserve-metadata=entitlements \
            "$framework_b/XPCServices/Downloader.xpc"
          codesign "${sign[@]}" "$framework_b/Autoupdate"
          codesign "${sign[@]}" "$framework_b/Updater.app"
          codesign "${sign[@]}" "$app/Contents/Frameworks/Sparkle.framework"
          codesign "${sign[@]}" --entitlements Resources/DogSC.entitlements "$app"
          codesign --verify --deep --strict "$app"

          echo "签名身份：$SIGNING_IDENTITY"
          codesign -dvvv "$app" 2>&1 | grep -E 'Identifier=|Authority=|Signature='

      - name: Create disk image
        id: dmg
        run: |
          set -euo pipefail

          staging="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$staging"
          ditto "$RUNNER_TEMP/DogSC.app" "$staging/DogSC.app"
          ln -s /Applications "$staging/Applications"

          image="$RUNNER_TEMP/DogSC-v${{ steps.meta.outputs.short }}-macOS.dmg"
          hdiutil create \
            -volname "DogSC" \
            -srcfolder "$staging" \
            -ov -format UDZO \
            "$image" >/dev/null
          hdiutil verify "$image" >/dev/null

          echo "path=$image" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$image"

      - name: Upload build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: DogSC-dmg
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 14

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          set -euo pipefail

          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          args=(
            release create "$GITHUB_REF_NAME" "$DMG"
            --title "DogSC $GITHUB_REF_NAME"
            --verify-tag
          )
          if [[ -s "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          gh "${args[@]}"
